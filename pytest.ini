[pytest]
# Локальный профиль тестов по умолчанию:
# используем SQLite-настройки, чтобы запуск не зависел от внешнего PostgreSQL.
DJANGO_SETTINGS_MODULE = loyalty_viewer.settings_test_sqlite

# Подхватываем привычные имена тестовых файлов в проекте.
python_files = tests.py test_*.py *_tests.py
testpaths = guests/tests

# Краткая сводка по упавшим/пропущенным тестам.
addopts = -ra

