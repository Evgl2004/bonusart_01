{% extends "base.html" %}

{% block title %}Редактировать категорию{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="h4 mb-3">Редактировать категорию</h1>

  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Название</label>
      {{ form.name }}
    </div>

    <div class="mb-3">
      <label class="form-label">Описание</label>
      {{ form.description }}
    </div>

    <div class="form-check mb-3">
      {{ form.is_active }}
      <label class="form-check-label">Активна</label>
    </div>

    <div class="mb-3">
      {{ form.external_id }}
      <label class="form-label">Внешний ID</label>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'categories' %}" class="btn btn-secondary ms-2">Отмена</a>
  </form>
</div>
{% endblock %}
