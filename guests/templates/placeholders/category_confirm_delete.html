{% extends "base.html" %}

{% block title %}Удалить категорию{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="h4 mb-3 text-danger">Удалить категорию</h1>

  <p>Вы уверены, что хотите удалить категорию
     <strong>{{ object.name }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'categories' %}" class="btn btn-secondary ms-2">Отмена</a>
  </form>
</div>
{% endblock %}
