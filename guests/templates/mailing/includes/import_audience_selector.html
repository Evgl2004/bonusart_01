<fieldset class="mb-3" data-mailing-import-operation-selector>
  <legend class="form-label fw-semibold mb-2">Операция с Excel</legend>
  <div class="vstack gap-2">
    <label class="border rounded p-2 d-flex gap-2 align-items-start">
      <input class="form-check-input mt-1" type="radio" name="import_operation" value="include"{% if not selected_import_operation or selected_import_operation == "include" %} checked{% endif %}>
      <span>
        <span class="fw-semibold d-block">Добавить гостей, указанных в Excel</span>
        <span class="text-muted small">Прежний режим: телефоны файла становятся кандидатами на добавление.</span>
      </span>
    </label>
    <label class="border border-warning rounded p-2 d-flex gap-2 align-items-start">
      <input class="form-check-input mt-1" type="radio" name="import_operation" value="exclude"{% if selected_import_operation == "exclude" %} checked{% endif %}>
      <span>
        <span class="fw-semibold d-block">Добавить всех допустимых, кроме указанных в Excel</span>
        <span class="text-muted small">Сначала будет показан предварительный расчёт без изменения кампании.</span>
      </span>
    </label>
  </div>
</fieldset>

<fieldset class="mb-3">
  <legend class="form-label fw-semibold mb-2">Кого добавить из Excel</legend>
  <div class="vstack gap-2">
    <label class="border rounded p-2 d-flex gap-2 align-items-start">
      <input class="form-check-input mt-1" type="radio" name="audience_channel_group" value="new_bots"{% if not selected_import_audience_group or selected_import_audience_group == "new_bots" %} checked{% endif %}>
      <span>
        <span class="fw-semibold d-block">Гости новых ботов</span>
        <span class="text-muted small">Есть разрешённая активная привязка к одному из выбранных ботов кампании.</span>
      </span>
    </label>
    <label class="border rounded p-2 d-flex gap-2 align-items-start">
      <input class="form-check-input mt-1" type="radio" name="audience_channel_group" value="historical_telegram"{% if selected_import_audience_group == "historical_telegram" %} checked{% endif %}>
      <span>
        <span class="fw-semibold d-block">Исторические Telegram-гости (старый бот)</span>
        <span class="text-muted small">Есть доступный исторический Telegram-канал и нет регистрации в новом контуре.</span>
      </span>
    </label>
    <label class="border rounded p-2 d-flex gap-2 align-items-start">
      <input class="form-check-input mt-1" type="radio" name="audience_channel_group" value="all_sendable"{% if selected_import_audience_group == "all_sendable" %} checked{% endif %}>
      <span>
        <span class="fw-semibold d-block">Все гости с доступным каналом отправки</span>
        <span class="text-muted small">Объединение новых и исторических гостей; каждый гость добавляется один раз.</span>
      </span>
    </label>
  </div>
</fieldset>

<script>
  (function () {
    "use strict";

    function updateImportButton(selector) {
      const form = selector.closest("form");
      if (!form) {
        return;
      }
      const selected = form.querySelector('input[name="import_operation"]:checked');
      const label = form.querySelector("[data-mailing-import-button-label]");
      if (!selected || !label || form.dataset.mailingImportSubmitting === "true") {
        return;
      }
      const text = selected.value === "exclude" ? "Рассчитать аудиторию" : "Импортировать";
      label.textContent = text;
      label.dataset.defaultText = text;
    }

    function initializeOperationSelectors() {
      document.querySelectorAll("[data-mailing-import-operation-selector]").forEach(function (selector) {
        selector.addEventListener("change", function () {
          updateImportButton(selector);
        });
        updateImportButton(selector);
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeOperationSelectors);
    } else {
      initializeOperationSelectors();
    }
  })();
</script>
