<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Система лояльности{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Choices.js (CSS для красивого мультиселекта) -->
    <link href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
          rel="stylesheet">

    <style>
      body {
        display: flex;
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
        background: #f9fafb;
      }
      .sidebar {
        width: 220px;
        background: #111827;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        padding: 1rem;
      }
      .sidebar h2 {
        font-size: 1.3rem;
        text-align: center;
        margin-bottom: 2rem;
        color: #f9fafb;
      }
      .sidebar a {
        color: #d1d5db;
        text-decoration: none;
        display: block;
        padding: .6rem 1rem;
        border-radius: .4rem;
        margin-bottom: .3rem;
        transition: background .2s;
      }
      .sidebar a:hover {
        background: #1f2937;
      }
      .sidebar a.active {
        background: #374151;
        color: #fff;
        font-weight: 500;
        border-left: 3px solid #60a5fa;
      }

      .content {
        flex-grow: 1;
        padding: 2rem;
        background: #f9fafb;
      }

    </style>

    {# сюда можно добавлять доп. стили из шаблонов-детей #}
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Боковое меню -->
    <nav class="sidebar">
      <h2>Система лояльности</h2>
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Гости</a>
      <a href="/categories/" class="{% if '/categories' in request.path %}active{% endif %}">Категории</a>
      <a href="/mailings/" class="{% if '/mailings' in request.path %}active{% endif %}">Рассылки</a>
      <a href="/analytics/" class="{% if '/analytics' in request.path %}active{% endif %}">Аналитика</a>
    </nav>

    <!-- Основное содержимое -->
    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Choices.js (JS) -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

    {# сюда шаблоны-дети (например guests_list.html) могут класть свой JS #}
    {% block extra_js %}{% endblock %}
  </body>
</html>
