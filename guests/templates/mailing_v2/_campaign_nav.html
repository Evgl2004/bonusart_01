{% if mailing and mailing.id %}
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="small text-muted me-1">Каркас кампании:</span>
        <a class="btn btn-sm {% if campaign_active_tab == 'overview' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'mailings_v2_campaigns_edit' mailing.id %}">Обзор</a>
        <a class="btn btn-sm {% if campaign_active_tab == 'audience' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'mailings_v2_campaigns_audience' mailing.id %}">Аудитория</a>
        <a class="btn btn-sm {% if campaign_active_tab == 'runs' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'mailings_v2_campaigns_runs' mailing.id %}">Запуски</a>
        <a class="btn btn-sm {% if campaign_active_tab == 'jobs' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'mailings_v2_campaigns_jobs' mailing.id %}">Задания</a>
        <a class="btn btn-sm {% if campaign_active_tab == 'errors' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'mailings_v2_campaigns_errors' mailing.id %}">Ошибки</a>
        <a class="btn btn-sm {% if campaign_active_tab == 'logs' %}btn-primary{% else %}btn-outline-secondary{% endif %}" href="{% url 'mailings_v2_campaigns_logs' mailing.id %}">Логи</a>
      </div>
    </div>
  </div>
{% endif %}
